name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # GitHub Pages caches every file for 10 minutes. Adding ?v=<commit> to every
      # CSS/JS URL means a new deploy never mixes with files from the old one.
      - name: Stamp asset URLs with the commit version
        run: |
          VERSION="${GITHUB_SHA::7}"

          # <link href="css/..."> and <script src="js/..."> in the HTML pages,
          # plus data-version, which js/utils/versionCheck.js compares with version.json
          sed -i -E \
            -e "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=${VERSION}\"#g" \
            -e "s#data-version=\"dev\"#data-version=\"${VERSION}\"#" \
            index.html admin.html

          # Relative ES module imports: from "./x.js" / from "../x.js"
          find js -name '*.js' -exec sed -i -E "s#(from \"\.{1,2}/[^\"?]+\.js)\"#\1?v=${VERSION}\"#g" {} +

          echo "{ \"version\": \"${VERSION}\" }" > version.json

          # Show what changed in the log, handy when something doesn't load
          grep -o '?v=[a-f0-9]*' index.html | sort | uniq -c

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
